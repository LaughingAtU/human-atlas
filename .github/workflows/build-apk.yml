name: Build Android APK (Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Extract Models & Patch Code
        run: |
          # 1. Ekstrak paksa semua model 3D dari .gz menjadi .bin mentah
          find public/models -name "*.gz" -exec gunzip -f {} +
          
          # 2. Ubah kode program agar memuat file .bin (bukan .bin.gz)
          find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i 's/\.bin\.gz/\.bin/g' {} +

      - name: Build Web App
        run: npm run build

      - name: Install, Init & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Human Atlas" "com.ashemag.humanatlas" --web-dir dist
          
          # Tulis ulang konfigurasi Capacitor
          cat <<EOF > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.ashemag.humanatlas',
            appName: 'Human Atlas',
            webDir: 'dist',
            server: {
              androidScheme: 'http',
              cleartext: true
            }
          };
          export default config;
          EOF
          
          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: human-atlas-final
          path: android/app/build/outputs/apk/debug/app-debug.apk
