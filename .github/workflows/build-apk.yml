name: Build Android APK (Hardcore Patch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --ignore-scripts

      # 1. Biarkan aplikasi di-build secara normal terlebih dahulu
      - name: Build Web App
        run: npm run build

      # 2. HACKING: Retas kode dan file hasil build (di dalam folder dist)
      - name: Hardcore Patch Final Compiled Code
        run: |
          # Ekstrak semua file model 3D (.gz) menjadi file mentah (.bin)
          find dist -type f -name "*.gz" -exec gunzip -f {} +
          
          # Timpa teks .bin.gz menjadi .bin di seluruh sistem kode hasil akhir
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.json" \) -exec sed -i 's/\.bin\.gz/\.bin/g' {} +

      # 3. Bungkus menjadi APK dengan konfigurasi keamanan khusus
      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Human Atlas" "com.ashemag.humanatlas" --web-dir dist
          
          # Paksa WebView Android menggunakan HTTPS agar tidak terblokir sistem CORS
          cat <<EOF > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.ashemag.humanatlas',
            appName: 'Human Atlas',
            webDir: 'dist',
            server: {
              androidScheme: 'https',
              cleartext: true
            }
          };
          export default config;
          EOF
          
          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: human-atlas-hardcore
          path: android/app/build/outputs/apk/debug/app-debug.apk
