name: Build Android APK (Patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Patch Source Code & Remove .gz
        run: |
          # Hapus file kompresi bawaan dari folder agar tidak duplikat di Android
          find public/models -type f -name "*.gz" -delete
          # Modifikasi paksa kode sumber TypeScript untuk membaca .bin, bukan .bin.gz
          find src -type f -name "*.ts" -o -name "*.tsx" -exec sed -i 's/\.bin\.gz/\.bin/g' {} +

      - name: Build Web App
        run: npm run build

      - name: Install, Init & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Human Atlas" "com.ashemag.humanatlas" --web-dir dist
          
          # Tulis ulang konfigurasi agar keamanan Android mengizinkan muat file 3D
          cat <<EOF > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.ashemag.humanatlas',
            appName: 'Human Atlas',
            webDir: 'dist',
            server: {
              androidScheme: 'http',
              cleartext: true
            }
          };
          export default config;
          EOF
          
          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: human-atlas-fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
